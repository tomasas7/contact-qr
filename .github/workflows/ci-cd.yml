name: CI/CD

# test ──► build & push image ─┐
#      └─► compose smoke test ─┴─► deploy (main only) ──► verify public URL
# Nothing is built or deployed unless every test passes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/tomasas7/contact-qr
  PUBLIC_URL: https://contact-qr.46-202-189-105.sslip.io

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contactqr
          POSTGRES_DB: contactqr_test
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway CI database: no credentials at all
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contactqr" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: contactqr
      POSTGRES_DB: contactqr_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.15"
          enable-cache: true
      - name: Install dependencies (locked)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Run tests
        run: uv run pytest --junitxml=junit.xml --cov=app --cov-report=term-missing
      - name: Coverage summary
        if: always()
        run: |
          echo "### Test coverage" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: junit.xml

  build:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          short="${GITHUB_SHA::7}"
          echo "tag=sha-$short" >> "$GITHUB_OUTPUT"
          echo "version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)+$short" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Compose smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the full local stack with one command
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Exercise the running stack
        run: |
          set -euxo pipefail
          curl -fsS http://localhost:8000/health | grep '"status":"ok"'
          id=$(curl -fsS -X POST http://localhost:8000/api/v1/contacts \
                 -H 'content-type: application/json' \
                 -d '{"first_name":"Smoke","last_name":"Test","phone":"+37061234567"}' | jq -r .id)
          curl -fsS -o qr.png "http://localhost:8000/api/v1/contacts/$id/qr"
          file qr.png | grep 'PNG image'
          curl -fsS "http://localhost:8000/api/v1/logs?source=API" | jq -e '.total >= 2'
      - name: Data survives container recreation
        run: |
          set -euxo pipefail
          docker compose down          # removes containers, keeps the named volume
          docker compose up --detach --wait --wait-timeout 180
          curl -fsS http://localhost:8000/api/v1/contacts | jq -e '.total == 1'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to production
    needs: [build, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: ${{ env.PUBLIC_URL }}
    concurrency:
      group: production
      cancel-in-progress: false # never interrupt a deploy halfway
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' \
            "${{ secrets.DEPLOY_HOST }}" "${{ secrets.DEPLOY_USER }}" > ~/.ssh/config
      - name: Upload deployment files
        run: scp docker-compose.prod.yml deploy/deploy.sh prod:/opt/contact-qr/
      - name: Deploy ${{ needs.build.outputs.tag }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Short-lived registry login: the job token expires when this job ends.
          ssh prod "docker login ghcr.io -u '${{ github.actor }}' --password-stdin" <<< "$GHCR_TOKEN"
          ssh prod "chmod +x /opt/contact-qr/deploy.sh && /opt/contact-qr/deploy.sh '${{ needs.build.outputs.tag }}'" \
            && status=0 || status=$?
          ssh prod "docker logout ghcr.io" || true
          exit $status
      - name: Verify public endpoint
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$PUBLIC_URL/health" | tee health.json
          grep -q "${{ needs.build.outputs.tag }}" <<< "sha-$(jq -r .version health.json | cut -d+ -f2)"
          echo "### Deployed \`${{ needs.build.outputs.tag }}\` to $PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
