<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Contact QR{% endblock %} · Contact QR</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <link rel="icon" href="{{ url_for('static', path='favicon.svg') }}" type="image/svg+xml">
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="/">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 3h8v8H3V3zm2 2v4h4V5H5zm8-2h8v8h-8V3zm2 2v4h4V5h-4zM3 13h8v8H3v-8zm2 2v4h4v-4H5zm8-2h2v2h-2v-2zm4 0h4v2h-4v-2zm-4 4h2v4h-2v-4zm4 0h2v2h2v4h-4v-2h-2v-2h2v-2z"/></svg>
        Contact QR
      </a>
      <nav aria-label="Main">
        {% set path = request.url.path %}
        {% set creating = path == '/' or (path == '/contacts' and request.method == 'POST') %}
        <a href="/" {% if creating %}aria-current="page"{% endif %}>New contact</a>
        <a href="/contacts" {% if path.startswith('/contacts') and not creating %}aria-current="page"{% endif %}>History</a>
        <a href="/logs" {% if path == '/logs' %}aria-current="page"{% endif %}>Request logs</a>
        <a href="/api/docs">API docs</a>
      </nav>
    </div>
  </header>
  <main class="container">
    {% if flash %}<div class="flash" role="status">{{ flash }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="container footer">Contact QR · v{{ app_version }}</footer>
</body>
</html>
