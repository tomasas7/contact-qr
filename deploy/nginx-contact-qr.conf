# Host nginx site for Contact QR -> /etc/nginx/sites-available/contact-qr
# The server already runs nginx on :80/:443 for other sites, so the app is added as one
# more virtual host instead of running a second proxy. TLS (Let's Encrypt) is added to
# this block by `certbot --nginx`, which also creates the HTTP->HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name contact-qr.46-202-189-105.sslip.io;

    client_max_body_size 64k;   # contact payloads are tiny

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so clients cannot inject a fake address chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
